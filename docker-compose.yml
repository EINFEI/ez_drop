version: "3.8"
services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "10001:80"
    networks:
      - ez_drop_network

  go-server:
    build:
      context: ./go-server
      dockerfile: Dockerfile
    ports:
      - "10002:3000"
    networks:
      - ez_drop_network

networks:
  ez_drop_network:
    driver: bridge
